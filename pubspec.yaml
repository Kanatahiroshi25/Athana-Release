name: lossless
description: "A new Flutter project."
publish_to: 'none'
version: 2.1.3+323

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  crypto: ^3.0.7
  newpipeextractor_dart: ^2.0.2
  just_audio: ^0.9.42
  audio_service: ^0.18.15
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  dart_ytmusic_api: ^1.3.6
  connectivity_plus: ^6.0.3
  flutter_svg: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/hires_audio.svg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "assets/icon_bg.png"
  adaptive_icon_foreground: "assets/icon_fg.png"